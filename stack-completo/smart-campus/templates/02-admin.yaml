---
# ─── Service ─────────────────────────────────────────────────────────────────
{{- if .Values.adminService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: smart-campus
  labels:
    app: admin
spec:
  selector:
    app: admin
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP
---
# ─── Deployment ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: smart-campus
  labels:
    app: admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      initContainers:
        {{- if .Values.postgres.enabled }}
        - name: wait-for-postgres
          image: busybox
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done']
        {{- end }}
      containers:
        - name: admin
          image: {{ .Values.adminService.image }}:{{ .Values.adminService.tag }}
          {{- $source := .Values.adminService.imageSource | default .Values.imageSource }}
          imagePullPolicy: {{ if eq $source "remote" }}IfNotPresent{{ else }}Never{{ end }}
          ports:
            - containerPort: 8081
          env:
            - name: ADMIN_SERVICE_PORT
              value: "8081"
            - name: POSTGRESQL_HOST
              value: postgres
            - name: POSTGRESQL_PORT
              value: "5432"
            - name: POSTGRESQL_DB
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRESQL_DB
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRESQL_USER
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRESQL_PASSWORD
            # ── OpenTelemetry — trazas distribuidas ───────────────
            # El agente Java (incluido en el Dockerfile) usa estas variables
            # para configurar el exportador OTLP sin modificar el código.
            # Los spans van a Alloy (namespace monitoring) que los reenvía a Tempo.
            - name: OTEL_SERVICE_NAME
              value: "admin"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://monitoring-alloy-otlp.monitoring.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_TRACES_SAMPLER
              value: "always_on"
            - name: OTEL_PROPAGATORS
              value: "tracecontext,baggage"
            # Desactivar exportadores no usados — Prometheus ya recolecta
            # métricas vía /actuator/prometheus y los logs van a Loki
            # directamente desde stdout del pod.
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=smart-campus,deployment.environment=thesis"
          livenessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
{{- end }}
