---
# ─── Service ─────────────────────────────────────────────────────────────────
{{- if .Values.frontendAdmin.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: frontend-admin
  namespace: smart-campus
  labels:
    app: frontend-admin
spec:
  selector:
    app: frontend-admin
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
---
# ─── Deployment ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-admin
  namespace: smart-campus
  labels:
    app: frontend-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-admin
  template:
    metadata:
      labels:
        app: frontend-admin
    spec:
      containers:
        - name: frontend-admin
          image: {{ .Values.frontendAdmin.image }}:{{ .Values.frontendAdmin.tag }}
          {{- $source := .Values.frontendAdmin.imageSource | default .Values.imageSource }}
          imagePullPolicy: {{ if eq $source "remote" }}IfNotPresent{{ else }}Never{{ end }}
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
{{- end }}
