# ── MinIO dedicado para logs ──────────────────────────────────────
minio:
  enabled: true
  rootUser: admin
  rootPassword: password
  storage: 10Gi

# ── Observabilidad ────────────────────────────────────────────────
observability:
  lowPriority: true

# ── Loki (modo monolítico) ────────────────────────────────────────
loki:
  namespaceOverride: monitoring
  deploymentMode: SingleBinary
  loki:
    auth_enabled: false
    storage:
      bucketNames:
        chunks: loki
        ruler: loki
        admin: loki
      type: s3
      s3:
        endpoint: http://minio-monitoring.monitoring.svc.cluster.local:9000
        accessKeyId: admin
        secretAccessKey: password
        s3ForcePathStyle: true
        insecure: true
        region: us-east-1
    commonConfig:
      replication_factor: 1
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      retention_period: 168h
    compactor:
      working_directory: /var/loki/compactor
      compaction_interval: 10m
      retention_enabled: true
      delete_request_store: s3
  singleBinary:
    replicas: 1
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            preference:
              matchExpressions:
                - key: role
                  operator: In
                  values:
                    - observability
    priorityClassName: observability-low-priority
    initContainers:
      - name: create-loki-bucket
        image: minio/mc:latest
        env:
          - name: MC_CONFIG_DIR
            value: /tmp/.mc
        command:
          - sh
          - -c
          - |
            until mc alias set local http://minio-monitoring.monitoring.svc.cluster.local:9000 admin password; do
              echo "waiting for minio...";
              sleep 3;
            done;
            mc mb --ignore-existing local/loki;
            echo "bucket loki ready"

  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  minio:
    enabled: false
  gateway:
    enabled: false
    affinity: {}
  lokiCanary:
    enabled: false
  test:
    enabled: false

# ── Tempo (backend de trazas distribuidas) ────────────────────────
tempo:
  namespaceOverride: monitoring
  replicas: 1

  tempo:
    multitenancy_enabled: false
    ingester:
      trace_idle_period: 20s
      max_block_bytes: 52428800
      complete_block_timeout: 45s
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"

    retention: 72h

    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
        wal:
          path: /var/tempo/wal
        block:
          version: vParquet4

    search:
      enabled: true

    global_overrides:
      max_bytes_per_trace: 10000000

  service:
    type: ClusterIP

  serviceAccount:
    create: true
    name: tempo

  persistence:
    enabled: true
    storageClassName: "local-path"
    accessModes:
      - ReadWriteOnce
    size: 5Gi

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

  securityContext:
    fsGroup: 10001
    runAsGroup: 10001
    runAsNonRoot: true
    runAsUser: 10001

  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3100"
    prometheus.io/path: "/metrics"

  priorityClassName: observability-low-priority

  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 1
          preference:
            matchExpressions:
              - key: role
                operator: In
                values:
                  - observability

# ── Alloy (recolector de logs + trazas) ──────────────────────────
alloy:
  namespaceOverride: monitoring
  crds:
    create: false
  alloy:
    configMap:
      content: |-
        // ============================================================
        // Pipeline de LOGS — recolección desde pods de Kubernetes
        // ============================================================
        discovery.kubernetes "pods" {
          role = "pod"
        }

        discovery.relabel "pod_logs" {
          targets = discovery.kubernetes.pods.targets
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app"]
            target_label  = "app"
          }
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            regex         = "smart-campus|monitoring"
            action        = "keep"
          }
        }

        loki.source.kubernetes "pods" {
          targets    = discovery.relabel.pod_logs.output
          forward_to = [loki.write.default.receiver]
        }

        loki.write "default" {
          endpoint {
            url = "http://monitoring-loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
          }
        }

        // ── Métricas Spring ───────────────────────────────────────
        discovery.relabel "spring_metrics" {
          targets = discovery.kubernetes.pods.targets
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            regex         = "smart-campus"
            action        = "keep"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
            regex         = "true"
            action        = "keep"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_ip", "__meta_kubernetes_pod_annotation_prometheus_io_port"]
            separator     = ":"
            target_label  = "__address__"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
            regex         = "(.+)"
            target_label  = "__metrics_path__"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app"]
            target_label  = "app"
          }
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }
        }

        prometheus.scrape "spring" {
          targets         = discovery.relabel.spring_metrics.output
          forward_to      = [prometheus.remote_write.local.receiver]
          scrape_interval = "30s"
        }

        prometheus.remote_write "local" {
          endpoint {
            url = "http://monitoring-prometheus-server.monitoring.svc.cluster.local/api/v1/write"
          }
        }

        // ============================================================
        // Pipeline de TRAZAS
        // ============================================================
        otelcol.receiver.otlp "default" {
          grpc {
            endpoint = "0.0.0.0:4317"
          }
          http {
            endpoint = "0.0.0.0:4318"
          }
          output {
            traces = [otelcol.processor.tail_sampling.drop_actuator.input]
          }
        }

        otelcol.processor.tail_sampling "drop_actuator" {
          decision_wait               = "5s"
          num_traces                  = 1000
          expected_new_traces_per_sec = 10

          policy {
            name = "drop-actuator"
            type = "string_attribute"
            string_attribute {
              key          = "http.route"
              values       = ["/actuator/health", "/actuator/prometheus", "/actuator/health/liveness", "/actuator/health/readiness"]
              invert_match = true
            }
          }
          output {
            traces = [otelcol.processor.batch.default.input]
          }
        }

        otelcol.processor.batch "default" {
          timeout         = "5s"
          send_batch_size = 1024
          output {
            traces = [otelcol.exporter.otlp.tempo.input]
          }
        }

        otelcol.exporter.otlp "tempo" {
          client {
            endpoint = "monitoring-tempo.monitoring.svc.cluster.local:4317"
            tls {
              insecure             = true
              insecure_skip_verify = true
            }
          }
        }
    mounts:
      varlog: false
  controller:
    type: daemonset
  service:
    enabled: true
    extraPorts:
      - name: otlp-grpc
        port: 4317
        targetPort: 4317
        protocol: TCP
      - name: otlp-http
        port: 4318
        targetPort: 4318
        protocol: TCP
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 1
          preference:
            matchExpressions:
              - key: role
                operator: In
                values:
                  - observability
  priorityClassName: observability-low-priority

# ── Grafana ───────────────────────────────────────────────────────
grafana:
  enabled: true
  namespaceOverride: monitoring
  adminPassword: admin
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: monitoring
  grafana.ini:
    server:
      root_url: "http://%(domain)s/grafana"
      serve_from_sub_path: true
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:

        - name: Prometheus
          type: prometheus
          uid: prometheus
          url: http://monitoring-prometheus-server.monitoring.svc.cluster.local
          access: proxy
          isDefault: false
          jsonData:
            httpMethod: POST
            exemplarTraceIdDestinations:
              - name: trace_id
                datasourceUid: tempo
                urlDisplayLabel: "Ver traza en Tempo"

        - name: Loki
          type: loki
          uid: loki
          url: http://monitoring-loki.monitoring.svc.cluster.local:3100
          access: proxy
          isDefault: true
          jsonData:
            maxLines: 1000
            derivedFields:
              - name: TraceID
                matcherRegex: '\[[\w-]+,([a-fA-F0-9]{16,32}),'
                url: "$${__value.raw}"
                datasourceUid: tempo
                urlDisplayLabel: "Ver traza"

        - name: Tempo
          type: tempo
          uid: tempo
          url: http://monitoring-tempo.monitoring.svc.cluster.local:3100
          access: proxy
          isDefault: false
          jsonData:
            httpMethod: GET
            tracesToLogsV2:
              datasourceUid: loki
              spanStartTimeShift: "-30m"
              spanEndTimeShift: "30m"
              filterByTraceID: true
              filterBySpanID: false
              tags:
                - key: "service.name"
                  value: "app"
            tracesToMetrics:
              datasourceUid: prometheus
              spanStartTimeShift: "-30m"
              spanEndTimeShift: "30m"
              tags:
                - key: "service.name"
                  value: "app"
              queries:
                - name: "Request Rate"
                  query: 'sum(rate(http_server_requests_seconds_count{app="${__tags.app}"}[5m]))'
                - name: "Error Rate"
                  query: 'sum(rate(http_server_requests_seconds_count{app="${__tags.app}", status=~"5.."}[5m]))'
                - name: "Latencia P95"
                  query: 'histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{app="${__tags.app}"}[5m])) by (le))'
            nodeGraph:
              enabled: true
            search:
              hide: false
            lokiSearch:
              datasourceUid: loki

        - name: Alertmanager
          type: alertmanager
          uid: alertmanager
          url: http://monitoring-alertmanager.monitoring.svc.cluster.local:9093
          access: proxy
          isDefault: false
          jsonData:
            handleGrafanaManagedAlerts: false
            implementation: prometheus

  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 1
          preference:
            matchExpressions:
              - key: role
                operator: In
                values:
                  - observability
  priorityClassName: observability-low-priority

# ── Prometheus ────────────────────────────────────────────────────
prometheus:
  namespaceOverride: monitoring
  server:
    extraArgs:
      # Habilitar almacenamiento de exemplars para correlación
      # de métricas con trazas (punto en gráfica → traza en Tempo).
      enable-feature: exemplar-storage
    extraFlags:
      - "web.enable-remote-write-receiver"
      - "web.enable-lifecycle"
    global:
      external_labels:
        cluster: smart-campus-k3s
    retention: "15d"
    persistentVolume:
      enabled: true
      size: 8Gi
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            preference:
              matchExpressions:
                - key: role
                  operator: In
                  values:
                    - observability
    priorityClassName: observability-low-priority
  alertmanager:
    enabled: true
    persistence:
      enabled: true
      size: 1Gi
      storageClass: "local-path"
    priorityClassName: observability-low-priority
    config:
      global:
        resolve_timeout: 5m
      route:
        group_by: ['alertname', 'app']
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        receiver: 'null'
      receivers:
        - name: 'null'
  serverFiles:
    alerting_rules.yml:
      groups:
        - name: smart-campus
          interval: 30s
          rules:

            - alert: ServicioCaido
              expr: absent(up{app="admin"}) or up{app="admin"} == 0 or absent(up{app="data"}) or up{app="data"} == 0
              for: 1m
              labels:
                severity: critical
              annotations:
                summary: "Servicio caído"
                description: "Un pod de admin o data lleva más de 1 minuto sin responder."

            - alert: MemoriaHeapCritica
              expr: >
                sum by (app) (jvm_memory_used_bytes{area="heap", app=~"admin|data"})
                /
                sum by (app) (clamp_min(jvm_memory_max_bytes{area="heap", app=~"admin|data"}, 1))
                > 0.005
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "Heap JVM crítico"
                description: "El heap de un microservicio está por encima del 0.5% durante 5 minutos. Umbral bajo configurado para validacion experimental (heap real medido entre 0.7-1.5%); en produccion se elevaria al 85-90%."

            - alert: CPUAltaSostenida
              expr: avg by (app) (process_cpu_usage{app=~"admin|data"}) > 0.02
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "CPU alta sostenida"
                description: "Un microservicio lleva 5 minutos usando mas del 2% de CPU. Umbral bajo configurado para validacion experimental (CPU real bajo carga: ~5%); en produccion se elevaria al 80%."

            - alert: ErroresHTTP
              expr: >
                sum by (app, uri, status) (rate(http_server_requests_seconds_count{app=~"admin|data", status=~"4..|5.."}[5m]))
                > 0.1
              for: 2m
              labels:
                severity: critical
              annotations:
                summary: "Errores HTTP detectados"
                description: "Revisar labels app, uri y status para identificar el endpoint afectado."

            - alert: LatenciaP95Alta
              expr: >
                histogram_quantile(0.95, sum by (app, uri, le) (rate(http_server_requests_seconds_bucket{app=~"admin|data", uri!~"/actuator.*"}[5m])))
                > 0.002
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Latencia P95 elevada"
                description: "Un endpoint lleva 5 minutos con P95 superior a 2ms. Umbral bajo configurado para validacion experimental; en produccion se elevaria a 500ms. Revisar labels app y uri para identificar el endpoint afectado."

  prometheus-pushgateway:
    enabled: false
  kube-state-metrics:
    enabled: false
  prometheus-node-exporter:
    enabled: false
