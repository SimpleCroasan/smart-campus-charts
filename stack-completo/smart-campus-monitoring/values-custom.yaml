# ── Prioridad ─────────────────────────────────────────────────────
# true  — baja prioridad, se apaga primero si faltan recursos
# false — prioridad normal, útil para pruebas de estrés
observability:
  lowPriority: true

# ── Componentes opcionales ────────────────────────────────────────
grafana:
  enabled: true

loki:
  lokiCanary:
    enabled: false
  test:
    enabled: false

# tempo está habilitado por defecto mediante la dependencia.
# Para deshabilitarlo en un despliegue reducido, descomentar:
# tempo:
#   enabled: false
