apiVersion: v2
name: smart-campus-monitoring
description: Stack de observabilidad para Smart Campus UIS
type: application
version: 0.3.0
appVersion: "1.0.0"

dependencies:
  - name: loki
    version: "6.53.0"
    repository: https://grafana.github.io/helm-charts
  - name: alloy
    version: "1.6.1"
    repository: https://grafana.github.io/helm-charts
  - name: grafana
    version: "10.5.15"
    repository: https://grafana.github.io/helm-charts
  - name: prometheus
    version: "28.13.0"
    repository: https://prometheus-community.github.io/helm-charts
  # ── Tempo: backend de trazas distribuidas ──────────────────────
  # Modo monolítico — un solo pod con todos los componentes internos.
  # Ideal para entornos de laboratorio/tesis sobre K3s de un nodo.
  - name: tempo
    version: "1.10.3"
    repository: https://grafana.github.io/helm-charts
