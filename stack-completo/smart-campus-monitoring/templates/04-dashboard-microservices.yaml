{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-smart-campus-microservices
  namespace: {{ .Values.grafana.namespaceOverride | default .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
data:
  smart-campus-microservices.json: |
    {
      "annotations": { "list": [] },
      "description": "Monitoreo de microservicios Smart Campus - admin y data (metodo RED: Rate, Errors, Duration)",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "id": 1,
          "title": "Tasa de peticiones HTTP (req/s) por servicio",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (app) (rate(http_server_requests_seconds_count{app=~\"admin|data\", uri!~\"/actuator.*\"}[$__rate_interval]))",
              "legendFormat": "{{ "{{" }}app{{ "}}" }}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 20,
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "showPoints": "never"
              },
              "unit": "reqps"
            }
          },
          "options": {
            "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "right" }
          }
        },
        {
          "id": 2,
          "title": "Tasa de errores 5xx (req/s) por servicio",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (app) (rate(http_server_requests_seconds_count{app=~\"admin|data\", status=~\"5..\"}[$__rate_interval]))",
              "legendFormat": "{{ "{{" }}app{{ "}}" }}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 30,
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "showPoints": "always"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 0.1 },
                  { "color": "red", "value": 1 }
                ]
              },
              "unit": "reqps"
            }
          },
          "options": {
            "legend": { "calcs": ["max", "sum"], "displayMode": "table", "placement": "right" }
          }
        },
        {
          "id": 3,
          "title": "Total errores 5xx (admin)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(increase(http_server_requests_seconds_count{app=\"admin\", status=~\"5..\"}[$__range])) or vector(0)",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 10 }
                ]
              },
              "unit": "short",
              "decimals": 0
            }
          },
          "options": { "colorMode": "background", "graphMode": "area", "textMode": "value_and_name" }
        },
        {
          "id": 4,
          "title": "Total errores 5xx (data)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(increase(http_server_requests_seconds_count{app=\"data\", status=~\"5..\"}[$__range])) or vector(0)",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 10 }
                ]
              },
              "unit": "short",
              "decimals": 0
            }
          },
          "options": { "colorMode": "background", "graphMode": "area", "textMode": "value_and_name" }
        },
        {
          "id": 5,
          "title": "Total errores 4xx (cliente)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(increase(http_server_requests_seconds_count{app=~\"admin|data\", status=~\"4..\"}[$__range])) or vector(0)",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 5 },
                  { "color": "orange", "value": 20 }
                ]
              },
              "unit": "short",
              "decimals": 0
            }
          },
          "options": { "colorMode": "background", "graphMode": "area", "textMode": "value_and_name" }
        },
        {
          "id": 6,
          "title": "Conexiones fallidas a backends (logs)",
          "description": "Coincidencias literales en logs del namespace",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 8 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "expr": "sum(count_over_time({namespace=\"smart-campus\"} |~ \"(?i)(connection refused|connection reset|unable to connect|broken pipe)\" [$__range]))",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 1 },
                  { "color": "red", "value": 5 }
                ]
              },
              "unit": "short",
              "decimals": 0
            }
          },
          "options": { "colorMode": "background", "graphMode": "none", "textMode": "value_and_name" }
        },
        {
          "id": 7,
          "title": "Latencia P95 por endpoint (segundos)",
          "description": "Percentil 95 de duracion de peticiones HTTP por app y URI",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (app, uri, le) (rate(http_server_requests_seconds_bucket{app=~\"admin|data\", uri!~\"/actuator.*\"}[$__rate_interval])))",
              "legendFormat": "{{ "{{" }}app{{ "}}" }} {{ "{{" }}uri{{ "}}" }}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineInterpolation": "smooth",
                "lineWidth": 1,
                "showPoints": "never"
              },
              "unit": "s"
            }
          },
          "options": {
            "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom" }
          }
        },
        {
          "id": 8,
          "title": "Top endpoints con mas errores 5xx",
          "description": "URIs con mayor tasa de errores 5xx en el rango",
          "type": "barchart",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "topk(5, sum by (app, uri) (increase(http_server_requests_seconds_count{app=~\"admin|data\", status=~\"5..\"}[$__range])))",
              "legendFormat": "{{ "{{" }}app{{ "}}" }} {{ "{{" }}uri{{ "}}" }}",
              "refId": "A",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "labelsToFields",
              "options": { "mode": "columns" }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 1 },
                  { "color": "red", "value": 5 }
                ]
              },
              "unit": "short",
              "decimals": 0
            }
          },
          "options": {
            "orientation": "horizontal",
            "showValue": "always",
            "barWidth": 0.7,
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": false }
          }
        },
        {
          "id": 9,
          "title": "Logs de admin",
          "type": "logs",
          "gridPos": { "h": 10, "w": 12, "x": 0, "y": 20 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "expr": "{namespace=\"smart-campus\", app=\"admin\"}",
              "refId": "A"
            }
          ],
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "showLabels": false,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          }
        },
        {
          "id": 10,
          "title": "Logs de data",
          "type": "logs",
          "gridPos": { "h": 10, "w": 12, "x": 12, "y": 20 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "expr": "{namespace=\"smart-campus\", app=\"data\"}",
              "refId": "A"
            }
          ],
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "showLabels": false,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          }
        },
        {
          "id": 11,
          "title": "Excepciones Java / Stack Traces",
          "description": "Lineas con excepcion o caused by; util para diagnostico cruzado con trazas",
          "type": "logs",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 30 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "expr": "{namespace=\"smart-campus\", app=~\"admin|data\"} |~ \"(?i)(exception|caused by)\"",
              "refId": "A"
            }
          ],
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "showLabels": false,
            "showCommonLabels": true,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          }
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["smart-campus", "microservices", "RED"],
      "templating": {
        "list": [
          {
            "current": { "selected": false, "text": "Prometheus", "value": "Prometheus" },
            "hide": 0,
            "label": "Prometheus",
            "name": "prometheus",
            "query": "prometheus",
            "refresh": 1,
            "type": "datasource"
          },
          {
            "current": { "selected": false, "text": "Loki", "value": "Loki" },
            "hide": 0,
            "label": "Loki",
            "name": "loki",
            "query": "loki",
            "refresh": 1,
            "type": "datasource"
          }
        ]
      },
      "time": { "from": "now-1h", "to": "now" },
      "title": "Smart Campus - Microservicios",
      "uid": "smart-campus-microservices",
      "version": 2
    }
{{- end }}
