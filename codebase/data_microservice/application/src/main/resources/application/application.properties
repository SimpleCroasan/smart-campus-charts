spring.application.name=data
spring.config.import=optional:classpath:application/env.properties
server.port=${DATA_SERVICE_PORT}
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
springdoc.swagger-ui.path=/swagger-ui.html
topic.listener=${TOPIC_LISTENER}
mqtt.broker.url=${MQTT_BROKER_URL}
mqtt.broker.client-id=${MQTT_BROKER_CLIENT_ID}
video.duration.minutes=1
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=data
logging.pattern.level=%5p [${spring.application.name},%X{trace_id:-},%X{span_id:-}]

# Habilita histograma de buckets para http.server.requests (P95/P99 reales en Prometheus)
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Calcula percentiles del lado cliente como respaldo
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
# Asocia trace_id como exemplar a las metricas (necesario para correlacion log-traza-metrica)
management.prometheus.metrics.export.descriptions=true
